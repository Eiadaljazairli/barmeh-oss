name: CI — Backend

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  ci:
    name: Lint + TypeCheck + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: barmeh_test
          POSTGRES_PASSWORD: barmeh_test_pass
          POSTGRES_DB: barmeh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://barmeh_test:barmeh_test_pass@localhost:5432/barmeh_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci-test-secret-min-64-chars-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      NODE_ENV: test
      SMS_PROVIDER: MOCK
      GEMINI_API_KEY: dummy
      TELEGRAM_BOT_TOKEN: dummy
      TELEGRAM_ADMIN_CHAT_ID: "0"
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_USER: test
      SMTP_PASS: test
      SMTP_FROM: test@example.com
      PUBLIC_BASE_URL: http://localhost:3000/uploads
      ELASTICSEARCH_NODE: http://localhost:9200

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint "{src,test}/**/*.ts" --max-warnings 0

      - name: Push schema to test DB
        run: npx prisma db push --force-reset

      - name: Run unit tests
        run: npm test -- --passWithNoTests --forceExit

      - name: Build
        run: npm run build
